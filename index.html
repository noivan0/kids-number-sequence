<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f59e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="숫자 순서대로!">
  <!-- PWA 최적화 (iOS 홈화면 추가 시 완전 웹앱처럼 동작) -->
  <meta name="description" content="3~7세 아이를 위한 숫자 순서 규칙 발견 게임. 눈으로 보고, 소리로 들으며 재미있게 배워요!">
  <title>숫자 순서대로! 🌟 | 3~7세 수 개념 놀이 (음성 지원)</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='80'%3E🌟%3C/text%3E%3C/svg%3E">
  <!-- PWA 아이콘 (iOS 홈화면 최적화) -->
  <link rel="apple-touch-icon" href="/kids-number-sequence/icons/apple-touch-icon.png" sizes="180x180">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Fredoka:wght@500;600;700&display=swap');

    body {
      font-family: 'Noto Sans KR', 'Fredoka', system-ui, -apple-system, sans-serif;
      background: #fff7ed;
      -webkit-tap-highlight-color: transparent;
    }

    .game-title {
      font-family: 'Fredoka', 'Noto Sans KR', system-ui, sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    /* === 유아 친화적 큰 터치 타겟 === */
    .level-card {
      transition: transform 0.12s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.12s ease;
      min-height: 96px;
    }
    .level-card:active {
      transform: scale(0.965);
    }

    .big-cell {
      min-width: 82px;
      min-height: 82px;
      font-size: 30px;
      font-weight: 800;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: white;
      border: 4px solid #e2e8f0;
      box-shadow: 0 4px 12px -2px rgb(0 0 0 / 0.1);
      transition: all 0.1s ease;
      user-select: none;
      cursor: pointer;
      padding: 4px;
    }
    .big-cell:active {
      transform: scale(0.9);
    }
    .big-cell.found {
      background: #dcfce7 !important;
      border-color: #4ade80 !important;
      color: #166534 !important;
      box-shadow: 0 0 0 8px rgba(74, 222, 128, 0.25);
    }
    .big-cell.wrong {
      animation: gentle-shake 0.32s ease;
      background: #fef3c7 !important;
      border-color: #fbbf24 !important;
    }

    @keyframes gentle-shake {
      0%, 100% { transform: translateX(0); }
      20%, 80% { transform: translateX(-5px); }
      40%, 60% { transform: translateX(5px); }
    }

    /* 단위 시각화 CSS 정리됨 (현재는 숫자만 깔끔하게 표시) */

    #play-area {
      background: #fffbeb;
      border: 6px solid #fbbf24;
      border-radius: 30px;
      padding: 14px;
      box-shadow: 0 12px 28px -10px rgb(0 0 0 / 0.12);
    }

    .choice-btn {
      min-height: 74px;
      font-size: 28px;
      font-weight: 800;
      border-radius: 24px;
      border: 4px solid #e2e8f0;
      background: white;
      transition: all 0.1s ease;
    }
    .choice-btn:active {
      transform: scale(0.93);
    }

    .lang-btn {
      min-height: 88px;
      font-size: 21px;
      font-weight: 800;
      border-radius: 26px;
      transition: all 0.15s ease;
    }
    .lang-btn.active {
      box-shadow: 0 0 0 5px rgba(244, 114, 182, 0.25);
      transform: scale(1.02);
    }

    .speaker-btn {
      width: 52px; height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      background: white;
      border: 3px solid #fbbf24;
      border-radius: 9999px;
      box-shadow: 0 3px 8px -2px rgb(0 0 0 / 0.1);
    }
    .speaker-btn:active {
      transform: scale(0.9);
      background: #fefce8;
    }

    .soft-shadow { box-shadow: 0 8px 0 #e2e8f0; }
  </style>
</head>
<body class="bg-[#fff7ed] select-none">
  <!-- START SCREEN -->
  <div id="start-screen" class="min-h-screen flex flex-col">
    <div class="h-3 bg-gradient-to-r from-pink-400 via-amber-400 to-orange-400"></div>

    <div class="flex-1 flex flex-col px-5 pt-6 pb-8 max-w-[400px] mx-auto w-full">
      <!-- Header -->
      <div class="flex items-center gap-3 mb-5 px-1">
        <div class="text-5xl">🌟</div>
        <div>
          <div class="game-title text-[29px] font-black text-slate-800 tracking-tighter leading-none">숫자 순서대로!</div>
          <div class="text-sm text-slate-500 mt-0.5">3~7세를 위한 신나는 수 놀이</div>
        </div>
      </div>

      <!-- === 언어 선택 (가장 중요한 신규 기능) === -->
      <div class="mb-6">
        <div class="text-center mb-2.5">
          <div class="text-xs font-bold text-slate-500 tracking-wider">소리로 들으며 배울래요?</div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <button id="lang-ko" onclick="selectLanguage('ko')"
                  class="lang-btn flex items-center justify-center gap-2 bg-white border-[5px] border-emerald-400 text-emerald-700 active:bg-emerald-50">
            <span class="text-3xl">🇰🇷</span>
            <div class="text-left leading-tight">
              <div class="font-extrabold text-lg">한국어</div>
              <div class="text-xs -mt-0.5 opacity-70">음성으로 읽어줘요</div>
            </div>
          </button>
          <button id="lang-en" onclick="selectLanguage('en')"
                  class="lang-btn flex items-center justify-center gap-2 bg-white border-[5px] border-sky-400 text-sky-700 active:bg-sky-50">
            <span class="text-3xl">🇺🇸</span>
            <div class="text-left leading-tight">
              <div class="font-extrabold text-lg">English</div>
              <div class="text-xs -mt-0.5 opacity-70">Hear the numbers</div>
            </div>
          </button>
        </div>
        <div id="lang-status" class="text-center mt-2 text-xs font-medium text-slate-500"></div>
      </div>

      <!-- 간단 안내 배너 (광고성 문구 최소화) -->
      <div class="mb-3 p-3 bg-amber-50 border border-amber-200 rounded-3xl text-center">
        <div class="text-amber-700 font-semibold text-sm">3~7세 아이가 스스로 규칙을 발견하는 수 개념 게임</div>
      </div>

      <!-- Level Selection -->
      <div id="level-selection" class="space-y-7">
        <!-- JS populated -->
      </div>

      <div class="mt-auto pt-5 text-center">
        <div class="text-[10px] text-slate-400">눈으로 보고, 소리로 들으며 규칙을 발견해요</div>
      </div>

      <!-- 부모 리포트 버튼 (공유 카드 기능은 사용자 요청으로 완전 삭제) -->
      <div class="mt-6 flex justify-center">
        <button onclick="showParentReport()" 
                class="px-8 py-3 rounded-3xl bg-white border border-blue-200 text-blue-700 font-bold text-sm active:bg-blue-50">
          📊 부모 리포트 보기
        </button>
      </div>
      <div class="text-center mt-2">
        <span class="text-[10px] text-slate-400">학습 진행 상황과 마스터리를 확인해보세요</span>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="hidden min-h-screen flex flex-col bg-[#fff7ed]">
    <div class="h-3 bg-gradient-to-r from-pink-400 via-amber-400 to-orange-400"></div>

    <div class="flex-1 flex flex-col px-4 pt-4 pb-6 max-w-[400px] mx-auto w-full">
      <!-- Game Header -->
      <div class="flex items-center justify-between mb-3 px-1">
        <button onclick="exitToMenu()"
                class="flex items-center gap-2 px-5 py-2.5 rounded-3xl bg-white text-slate-700 font-semibold text-sm shadow-sm active:bg-slate-100">
          ← 나가기
        </button>

        <div id="level-pill"
             class="px-5 py-1.5 rounded-3xl text-sm font-extrabold text-center shadow-sm">
        </div>

        <div id="progress-pill"
             class="px-4 py-1.5 bg-white rounded-3xl text-sm font-bold shadow-sm flex items-center gap-1">
        </div>
      </div>

      <!-- Question + Speaker -->
      <div class="mb-4 text-center">
        <div id="question-label" class="text-sm text-slate-500 mb-1.5 font-medium"></div>
        
        <div class="flex items-center justify-center gap-3">
          <div id="target-display"
               class="inline-flex items-center justify-center min-w-[94px] h-[94px] text-6xl font-black text-slate-800 bg-white rounded-3xl shadow-sm border border-slate-100">
            ?
          </div>
          <!-- Speak current target button - 명확하게 "다음 숫자 듣기" 목적 -->
          <div class="flex flex-col items-center">
            <button id="speak-btn" onclick="speakCurrentTarget()" 
                    class="speaker-btn text-amber-600 active:text-amber-700" aria-label="다음 숫자 소리 듣기">
              🔊
            </button>
            <div class="text-[9px] text-amber-600 mt-0.5 font-bold tracking-tight">다음 숫자</div>
          </div>
        </div>
      </div>

      <!-- Main Play Area -->
      <div id="play-area" class="flex-1 flex flex-col items-center justify-center mb-3">
        <div id="play-content" class="w-full"></div>
      </div>

      <!-- Hint -->
      <button onclick="giveHint()"
              class="w-full py-3.5 rounded-3xl bg-white text-amber-600 font-bold flex items-center justify-center gap-2 shadow-sm active:bg-amber-50 text-sm tracking-tight">
        💡 힌트 보기
      </button>
    </div>
  </div>

  <!-- Celebration Modal -->
  <div id="celebration-modal" onclick="hideCelebration()"
       class="hidden fixed inset-0 bg-black/50 flex items-end justify-center z-50">
    <div onclick="event.stopImmediatePropagation()"
         class="bg-white w-full max-w-[400px] rounded-t-3xl p-8 text-center">
      <div class="text-5xl mb-2" id="celebration-emoji"></div>
      <div class="game-title text-3xl font-black text-pink-600 mb-1">대단해요!</div>
      <div id="celebration-text" class="text-xl text-slate-600 mb-6 font-semibold">규칙을 발견했어요!</div>

      <div class="flex gap-3">
        <button onclick="hideCelebration(); exitToMenu()"
                class="flex-1 py-4 rounded-3xl bg-slate-100 font-extrabold text-slate-600 text-base active:bg-slate-200">
          그만하기
        </button>
        <button onclick="hideCelebration(); continuePlaying()"
                class="flex-1 py-4 rounded-3xl bg-gradient-to-r from-pink-500 to-orange-500 text-white font-extrabold text-base active:brightness-95">
          더 해볼래요!
        </button>
      </div>
    </div>
  </div>

  <!-- 컨페티 캔버스 제거 (꽃가루 효과 삭제) -->

  <script>
    // ==================== CONFIG & STATE ====================
    let currentLang = 'ko';           // 'ko' or 'en'
    let voicesLoaded = false;
    let availableVoices = [];
    let currentLevel = null;
    let sequence = [];
    let foundCount = 0;
    let shuffled = [];
    let currentActivity = 'hunt';
    let isProcessing = false;         // 안정성: 동시 입력 방지
    let gameActive = false;
    let currentTrackId = null;        // "더 할래요" 시 같은 단계 계속하기 위해 저장

    // ==================== 진행도 시스템 (localStorage 기반, v2 확장 준비) ====================
    function getProgress() {
      try {
        const raw = JSON.parse(localStorage.getItem('kids_number_progress') || '{}');
        // v1 호환: 단순 숫자 → v2 객체로 자동 업그레이드
        const upgraded = {};
        Object.keys(raw).forEach(key => {
          const val = raw[key];
          if (typeof val === 'number') {
            upgraded[key] = { stars: val, lastPlayed: null, playCount: 1 };
          } else {
            upgraded[key] = val;
          }
        });
        return upgraded;
      } catch (e) {
        return {};
      }
    }

    function saveProgress(trackId, stars) {
      const progress = getProgress();
      const current = progress[trackId] || { stars: 0, playCount: 0 };
      const newStars = Math.max(current.stars || 0, stars);
      progress[trackId] = {
        stars: newStars,
        lastPlayed: new Date().toISOString().slice(0, 10),
        playCount: (current.playCount || 0) + 1
      };
      localStorage.setItem('kids_number_progress', JSON.stringify(progress));
    }

    function getStarsForTrack(trackId) {
      const progress = getProgress();
      return (progress[trackId] && progress[trackId].stars) || 0;
    }

    function getStarDisplay(trackId) {
      const stars = getStarsForTrack(trackId);
      if (stars === 0) return '<span class="text-slate-300 text-xs">☆☆☆</span>';
      return '<span class="text-amber-400 text-xs">' + '★'.repeat(stars) + '</span>' + '<span class="text-slate-300 text-xs">' + '☆'.repeat(3 - stars) + '</span>';
    }

    function getProgressSummary() {
      const progress = getProgress();
      const entries = Object.keys(progress);
      const totalStars = entries.reduce((sum, k) => sum + (progress[k].stars || 0), 0);
      const completed = entries.length;
      // Phase별 집계 (간단 버전)
      const phaseMap = {
        1: ['1-A','1-B','1-C'],
        2: ['2-A','2-B','2-C','2-D'],
        3: ['3-2','3-3','3-4','3-5','3-6','3-7','3-8','3-9','3-10'],
        4: ['4-A','4-B','4-C','4-D','4-E','4-F']
      };
      const phaseStats = {};
      Object.keys(phaseMap).forEach(p => {
        const tracks = phaseMap[p];
        let pStars = 0, pDone = 0;
        tracks.forEach(t => {
          if (progress[t]) {
            pStars += progress[t].stars || 0;
            pDone++;
          }
        });
        phaseStats[p] = { done: pDone, total: tracks.length, stars: pStars };
      });
      return { totalStars, completed, totalTracks: 22, phaseStats, progress };
    }

    // ==================== 부모 리포트 (공유 카드/성장카드 기능은 사용자 요청으로 완전 삭제) ====================
    function showShareCard() {
      // 공유 카드(성장카드) 기능은 사용자 요청("공유카드 만들기 항목을 그냥 전부 삭제해주세요")에 따라
      // 완전히 제거되었습니다. 이 스텁은 호출 안전성을 위해 유지되며, 실제 동작은 하지 않습니다.
      // (getProgressSummary 헬퍼는 부모 리포트에서 계속 사용되므로 삭제하지 않음)
      return;
    }

    function showParentReport() {
      const { totalStars, completed, totalTracks, phaseStats, progress } = getProgressSummary();

      // 간단 인사이트 생성 (스펙 기반)
      const insights = [];
      const weakPhases = [];
      Object.keys(phaseStats).forEach(pid => {
        const s = phaseStats[pid];
        if (s.done < s.total * 0.6) weakPhases.push(`Phase ${pid}`);
      });
      if (weakPhases.length > 0) {
        insights.push(`도전 중인 영역: ${weakPhases.join(', ')} — 이 Phase를 다시 해보면 좋아요.`);
      }
      if (totalStars < completed * 2) {
        insights.push('별 3개를 받은 트랙이 아직 적어요. 한 트랙을 여러 번 도전해보세요!');
      }
      if (completed >= 15) {
        insights.push('훌륭합니다! 대부분의 기본 단위 개념을 잘 익히고 있어요.');
      }
      if (insights.length === 0) {
        insights.push('꾸준히 플레이하고 있어요. Phase 3 패턴 발견이 특히 중요합니다.');
      }

      // Phase 상세 HTML
      let phaseHtml = '';
      const phaseMeta = {
        1: { emoji: '🐣', name: '순서 감각', color: '#10b981' },
        2: { emoji: '🦊', name: '10의 자리 직관', color: '#0ea5e9' },
        3: { emoji: '⭐', name: '패턴 발견', color: '#f59e0b' },
        4: { emoji: '🚀', name: '큰 수 감각', color: '#f43f5e' }
      };
      Object.keys(phaseStats).forEach(pid => {
        const s = phaseStats[pid];
        const m = phaseMeta[pid];
        const pct = Math.round((s.done / s.total) * 100);
        phaseHtml += `
          <div class="flex items-center justify-between bg-white border rounded-2xl px-4 py-3 mb-2" style="border-color:${m.color}40">
            <div class="flex items-center gap-3">
              <span class="text-3xl">${m.emoji}</span>
              <div>
                <div class="font-bold" style="color:${m.color}">Phase ${pid}. ${m.name}</div>
                <div class="text-xs text-slate-500">${s.done}/${s.total} 트랙 완료</div>
              </div>
            </div>
            <div class="text-right">
              <div class="text-2xl font-black" style="color:#fbbf24">${'★'.repeat(Math.floor(s.stars / Math.max(1,s.total)))}</div>
              <div class="text-xs text-emerald-600 font-bold">${pct}%</div>
            </div>
          </div>
        `;
      });

      const html = `
        <div class="fixed inset-0 bg-black/60 flex items-center justify-center z-[100] p-3" onclick="this.remove()">
          <div class="bg-[#fff7ed] max-w-[400px] w-full mx-auto rounded-3xl overflow-hidden shadow-xl" onclick="event.stopImmediatePropagation()">
            <!-- 헤더 -->
            <div class="bg-white px-5 py-4 flex items-center justify-between border-b">
              <div>
                <div class="text-2xl font-black text-slate-800">📊 부모 리포트</div>
                <div class="text-xs text-emerald-600 font-bold">베타 · 로컬 데이터 기반</div>
              </div>
              <button onclick="this.closest('.fixed').remove()" class="text-3xl text-slate-400 leading-none">×</button>
            </div>

            <div class="p-5 space-y-5 max-h-[78vh] overflow-auto">
              <!-- Overview -->
              <div class="grid grid-cols-2 gap-3">
                <div class="bg-emerald-100 rounded-3xl p-4">
                  <div class="text-emerald-700 text-sm font-bold">총 별 개수</div>
                  <div class="text-5xl font-black text-emerald-700 mt-1">${totalStars}<span class="text-3xl">★</span></div>
                </div>
                <div class="bg-amber-100 rounded-3xl p-4">
                  <div class="text-amber-700 text-sm font-bold">완료 트랙</div>
                  <div class="text-5xl font-black text-amber-700 mt-1">${completed}<span class="text-3xl">/22</span></div>
                  <div class="text-xs text-amber-600 mt-0.5">${Math.round(completed/22*100)}% 진행</div>
                </div>
              </div>

              <!-- Phase Mastery -->
              <div>
                <div class="font-bold text-lg mb-2 px-1">Phase별 마스터리</div>
                ${phaseHtml}
              </div>

              <!-- 인사이트 -->
              <div class="bg-white rounded-3xl p-4 border border-blue-100">
                <div class="font-bold text-blue-700 mb-2 flex items-center gap-2">💡 AI 인사이트 (미리보기)</div>
                <ul class="text-sm text-slate-700 space-y-1.5">
                  ${insights.map(i => `<li class="pl-1">• ${i}</li>`).join('')}
                </ul>
                <div class="mt-3 text-[10px] text-blue-500 font-medium">※ 더 정확한 약점 분석·추천 활동·PDF 내보내기는 프리미엄에서 제공됩니다.</div>
              </div>

              <!-- 다음 목표 -->
              <div class="bg-white rounded-3xl p-4">
                <div class="font-bold mb-2">🎯 추천 다음 목표</div>
                <div class="text-sm text-slate-600">별이 낮은 트랙을 1~2개 골라 집중해보세요. 10 단위와 큰 수(Phase 2·4)가 특히 중요합니다.</div>
              </div>
            </div>

            <!-- 하단 액션 (공유 카드 버튼은 완전 삭제됨) -->
            <div class="p-5 pt-0 bg-[#fff7ed]">
              <button onclick="alert('PDF 내보내기와 상세 리포트는 프리미엄 출시 후 제공됩니다. 지금은 로컬 데이터로 기본 분석만 가능해요!');" 
                      class="w-full py-3.5 rounded-3xl bg-blue-600 text-white font-bold active:bg-blue-700 text-sm">

    // ==================== 숫자 음성 읽기 (핵심 기능) ====================
    function loadVoices() {
      return new Promise(resolve => {
        const synth = window.speechSynthesis;
        if (!synth) return resolve(false);

        const load = () => {
          availableVoices = synth.getVoices();
          voicesLoaded = availableVoices.length > 0;
          resolve(voicesLoaded);
        };

        if (availableVoices.length > 0) {
          load();
        } else {
          synth.onvoiceschanged = load;
          setTimeout(() => { if (!voicesLoaded) load(); }, 1200);
        }
      });
    }

    function getBestVoice(lang) {
      if (!availableVoices.length) return null;

      const langCode = lang === 'ko' ? 'ko-KR' : 'en-US';
      const lower = lang === 'ko' ? 'ko' : 'en';

      // 1. 정확한 언어 코드 매칭 (여성 선호)
      let voice = availableVoices.find(v => 
        v.lang === langCode && (v.name.toLowerCase().includes('female') || v.name.includes('Siri') || v.name.includes('Google'))
      );
      if (voice) return voice;

      // 2. 언어 코드만 매칭
      voice = availableVoices.find(v => v.lang === langCode);
      if (voice) return voice;

      // 3. 부분 매칭
      voice = availableVoices.find(v => v.lang.toLowerCase().startsWith(lower));
      return voice || availableVoices[0];
    }

    function numberToKorean(num) {
      if (num === 0) return '영';
      const ones = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const tens = ['', '십', '이십', '삼십', '사십', '오십', '육십', '칠십', '팔십', '구십'];
      const hundreds = ['', '백', '이백', '삼백', '사백', '오백', '육백', '칠백', '팔백', '구백'];

      if (num < 10) return ones[num];
      if (num < 100) {
        const t = Math.floor(num / 10);
        const o = num % 10;
        return tens[t] + (o ? ones[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100);
        const rest = num % 100;
        return hundreds[h] + (rest ? numberToKorean(rest) : '');
      }
      return num.toString(); // 1000 이상은 그냥 숫자
    }

    function numberToEnglish(num) {
      const ones = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
      const teens = ['ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
      const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

      if (num < 10) return ones[num];
      if (num < 20) return teens[num - 10];
      if (num < 100) {
        const t = Math.floor(num / 10);
        const o = num % 10;
        return tens[t] + (o ? ' ' + ones[o] : '');
      }
      if (num < 1000) {
        const h = Math.floor(num / 100);
        const rest = num % 100;
        return ones[h] + ' hundred' + (rest ? ' ' + numberToEnglish(rest) : '');
      }
      return num.toString();
    }

    function speakNumber(num) {
      if (!('speechSynthesis' in window)) return;

      const text = currentLang === 'ko' ? numberToKorean(num) : numberToEnglish(num);
      speakText(text, currentLang);
    }

    function speakText(text, lang = currentLang) {
      if (!('speechSynthesis' in window)) {
        console.warn('TTS not supported');
        return;
      }

      const synth = window.speechSynthesis;
      synth.cancel(); // 이전 음성 중지

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang === 'ko' ? 'ko-KR' : 'en-US';
      utterance.rate = lang === 'ko' ? 0.92 : 0.95;   // 아이가 따라 말하기 쉽게 조금 느리게
      utterance.pitch = 1.05;
      utterance.volume = 0.95;

      const voice = getBestVoice(lang);
      if (voice) utterance.voice = voice;

      synth.speak(utterance);
    }

    function speakCurrentTarget() {
      if (!currentLevel || !gameActive) return;
      const targetEl = document.getElementById('target-display');
      const val = parseInt(targetEl.textContent);
      if (!isNaN(val)) {
        speakNumber(val);
      } else if (targetEl.textContent === '?') {
        speakText(currentLang === 'ko' ? '다음 숫자를 찾아보세요' : 'Find the next number');
      }
    }

    function safeSetProcessing(val) {

    // ==================== DYNAMIC LEVEL GENERATOR (정확성 + 대폭 다양성 강화) ====================
    // 각 Track의 라벨("1부터 10까지" 등)과 실제 생성 문제가 100% 일치하도록 엄격하게 관리
    function generateLevel(track) {
      const t = { ...track };
      const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

      let start, count, styles;

      if (track.id === "1-A") {
        // "1부터 10까지" — **반드시 1에서 시작**하도록 엄격하게 제한 (사용자 요청 반영)
        styles = [
          { start: 1, count: rand(5, 7) },   // 1~6 ~ 1~7 (매우 쉬운 버전)
          { start: 1, count: rand(6, 8) },   // 1~7 ~ 1~8
          { start: 1, count: rand(7, 9) },   // 1~8 ~ 1~9
          { start: 1, count: rand(8, 10) },  // 1~9 ~ 1~10 (가장 표준)
          { start: 1, count: rand(9, 11) },  // 1~10 ~ 1~11 (조금 더 긴 버전)
          { start: 1, count: rand(6, 9) },   // 1~7 ~ 1~9 (랜덤 길이)
          { start: 1, count: rand(10, 12) }  // 1~11 ~ 1~12 (도전형)
        ];
        const s = styles[rand(0, styles.length - 1)];
        start = s.start;  // 항상 1
        count = s.count;

        // === 숫자블록 그리드 규격 (사용자 지정) ===
        // - 열방향(열): 모든 Phase, 모든 트랙에서 **3열 고정**
        // - 행방향(행): 최소 3행 ~ 최대 5행
        //   (힌트보기 버튼까지 한 화면에 보여야 하므로 스크롤 없이 최대 15개)
        t.cols = 3;

        // count 상한 강제 (3열 × 5행 = 15개 초과 방지)
        count = Math.min(count, 15);

        t.activity = 'hunt';

      } else if (track.id === "1-B") {
        // "1부터 20까지" — 1~20 구간을 다양하게 (최대 15개 제한)
        styles = [
          { start: 1, count: rand(8, 11) },    // 1~9 ~ 1~11
          { start: 3, count: rand(8, 11) },    // 3~11 ~ 3~13
          { start: 5, count: rand(7, 10) },    // 5~12 ~ 5~14
          { start: 1, count: Math.min(15, rand(10, 12)) },   // 최대 15개
          { start: 8, count: Math.min(15, rand(7, 10)) }     // 최대 15개
        ];
        const s = styles[rand(0, styles.length - 1)];
        start = s.start;
        count = s.count;
        t.activity = 'hunt';

      } else if (track.id === "1-C") {
        // "1부터 30까지" — Phase 1 최장 시퀀스
        // 모바일 스크롤 방지 + 유아 인지 부담 고려 → 최대 18개 제한
        // 4열 기준으로 4~5줄 이내로 유지
        styles = [
          { start: 1, count: rand(14, 17) },   // 1~15 ~ 1~18 (추천 범위)
          { start: 1, count: rand(15, 18) },   // 조금 더 길게
          { start: 1, count: rand(13, 16) },
          { start: 2, count: rand(14, 17) },
          { start: 3, count: rand(13, 16) }
        ];
        const s = styles[rand(0, styles.length - 1)];
        start = s.start;
        count = s.count;
        t.activity = 'hunt';

      } else if (track.id.startsWith("2-")) {
        // Phase 2 (new): 10의 자리 직관 - 세분화된 4개 트랙
        if (track.id === "2-A") {
          // 10, 20, 30의 경계 느끼기 (Phase 2 핵심)
          // 1-C(긴 연속 세기)와 차별화: 짧은 시퀀스로 10의 배수를 반복적으로 넘음
          // 한 레벨에서 10, 20 경계를 2~3번 넘는 경험 제공
          styles = [
            // 10 근처에서 시작해서 10 넘기
            { start: 7 + rand(0, 4), count: rand(5, 7) },     // 예: 8~13, 9~15, 11~17
            // 15~25 근처 (20 경계 넘기)
            { start: 14 + rand(0, 5), count: rand(5, 7) },    // 예: 15~21, 17~23, 19~25
            // 22~32 근처 (20과 30 경계 넘기)
            { start: 21 + rand(0, 4), count: rand(5, 7) },    // 예: 22~28, 24~30, 25~31
          ];
        } else if (track.id === "2-B") {
          // 10부터 50까지 - 기본
          styles = [
            { start: 10, count: rand(6, 8) },
            { start: 20, count: rand(6, 8) },
            { start: 10, count: rand(8, 10) },
          ];
        } else if (track.id === "2-C") {
          // 10부터 100까지 - 확장
          styles = [
            { start: 10 + rand(0, 4) * 10, count: rand(7, 9) },
            { start: 20 + rand(0, 5) * 10, count: rand(7, 10) },
          ];
        } else if (track.id === "2-D") {
          // 10씩 더하고 빼기 — 10 단위 조작 경험 (Phase 2 핵심)
          // Phase 3의 "10씩 커지는 수"와 차별화:
          // - 범위를 10~80으로 제한 (10 단위 직관 집중)
          // - 실제 빼기와 상하 이동 시퀀스를 생성 (단순 +10 패턴과 구분)

          const center = 30 + rand(0, 3) * 10; // 30~60

          // 기본 ascending 시퀀스 생성 후, 방향을 랜덤으로 결정
          const baseStart = center - rand(0, 2) * 10;
          const baseCount = Math.max(9, rand(5, 8));   // 최소 3행 보장

          styles = [
            // 순수 더하기
            { start: baseStart, count: baseCount },
            // 순수 빼기
            { start: baseStart + rand(3, 5) * 10, count: baseCount },
            // 상하 이동
            { start: center, count: Math.max(9, rand(6, 9)) },
          ];
        }
        const s = styles[rand(0, styles.length - 1)];
        start = s.start;
        count = s.count;
        t.activity = 'hunt';

      } else if (track.id.startsWith("3-")) {
        // Phase 3 (new): 패턴 발견 (2~10씩)
        const step = track.step;
        let minMult = 1;
        let maxMult = Math.floor(70 / step);

        if (step <= 3) maxMult = Math.floor(50 / step);
        if (step >= 8) minMult = 2;

        styles = [
          { start: step * rand(minMult, Math.max(minMult + 2, maxMult - 5)), count: rand(6, 8) },
          { start: step * rand(minMult + 1, Math.max(minMult + 3, maxMult - 3)), count: rand(7, 9) },
          { start: step * rand(minMult, maxMult), count: rand(6, 9) }
        ];
        const s = styles[rand(0, styles.length - 1)];
        start = s.start;
        count = s.count;
        t.activity = 'hunt';

      } else if (track.id.startsWith("4-")) {
        // Phase 4: 큰 수 감각 (100 ~ 10000)
        // - 각 트랙별로 시작점과 간격을 교육적으로 세밀하게 조정
        // - 4-F에서는 step 500과 1000을 혼합하여 큰 규모의 수 감각 훈련
        // - count는 항상 9~15 사이로 제한 (3열 × 3~5행 규격 준수)
        const minCount = 9;
        const maxCount = 15;

        if (track.id === "4-A") {
          // 100부터 300까지 — 100 단위의 기본적인 크기와 순서 감각
          styles = [
            { start: 100 + rand(0, 6) * 10, count: rand(minCount, maxCount) },
            { start: 140 + rand(0, 8) * 10, count: rand(minCount, maxCount) },
            { start: 180 + rand(0, 5) * 10, count: rand(minCount, maxCount) },
          ];
        } else if (track.id === "4-B") {
          // 100부터 500까지 — 100 단위 범위 확장, 더 많은 100의 배수 경험
          styles = [
            { start: 100 + rand(0, 12) * 10, count: rand(minCount, maxCount) },
            { start: 200 + rand(0, 10) * 10, count: rand(minCount, maxCount) },
            { start: 300 + rand(0, 8) * 10, count: rand(minCount, maxCount) },
          ];
        } else if (track.id === "4-C") {
          // 100부터 1000까지 — 100 → 1000 단위 전환의 핵심 구간 (step 50)
          styles = [
            { start: 100 + rand(0, 6) * 50, count: rand(minCount, maxCount) },
            { start: 250 + rand(0, 5) * 50, count: rand(minCount, maxCount) },
            { start: 400 + rand(0, 4) * 50, count: rand(minCount, maxCount) },
          ];
        } else if (track.id === "4-D") {
          // 1000부터 3000까지 — 1000 단위의 기본적인 크기 감각 (step 100)
          styles = [
            { start: 1000 + rand(0, 6) * 100, count: rand(minCount, maxCount) },
            { start: 1400 + rand(0, 5) * 100, count: rand(minCount, maxCount) },
            { start: 1800 + rand(0, 4) * 100, count: rand(minCount, maxCount) },
          ];
        } else if (track.id === "4-E") {
          // 1000부터 5000까지 — 1000 단위 범위 확장, 큰 수의 상대적 크기 느끼기
          styles = [
            { start: 1000 + rand(0, 10) * 100, count: rand(minCount, maxCount) },
            { start: 2000 + rand(0, 8) * 100, count: rand(minCount, maxCount) },
            { start: 3000 + rand(0, 6) * 100, count: rand(minCount, maxCount) },
          ];
        } else if (track.id === "4-F") {
          // 1000부터 10000까지 — 가장 큰 수 구간 (강화)
          // 더 큰 간격(step 500, 1000)으로 큰 수의 규모 감각 훈련
          styles = [
            // step 500
            { start: 1000 + rand(0, 6) * 500, count: rand(minCount, maxCount) },
            // step 1000 (사용자 요청: 더 큰 간격 추가)
            { start: 2000 + rand(0, 4) * 1000, count: rand(minCount, maxCount) },
            // step 1000 + 변형 (더 넓은 범위)
            { start: 3000 + rand(0, 3) * 1000, count: rand(minCount, maxCount) },
            // step 500 + 1000 혼합 느낌의 큰 점프
            { start: 1500 + rand(0, 5) * 500, count: rand(minCount, maxCount) },
          ];
        }
        const s = styles[rand(0, styles.length - 1)];
        start = s.start;
        count = s.count;
        t.cols = 3;
        t.activity = 'hunt';
      } else {
        // Fallback (should not reach)
        start = 100;
        count = 6;
        t.cols = 3;
        t.activity = 'hunt';
      }

      t.start = start;

      // === 최종 그리드 규격 강제 적용 (사용자 지정) ===
      t.cols = 3;                           // 열방향: 모든 단계 3열 고정
      count = Math.min(count, 15);          // 최대 15개 (3열 × 5행)

      // 행방향 최소 3행 보장 (사용자 요청)
      count = Math.max(9, count);           // 최소 9개 (3열 × 3행)

      t.count = count;
      t.end = start + (t.count - 1) * t.step;
      t.range = `${start}~${t.end}`;
      return t;
    }

    function buildSequence(level) {
      const seq = [];
      for (let i = 0; i < level.count; i++) {
        seq.push(level.start + i * level.step);
      }
      return seq;
    }

    // ==================== START LEVEL (안정성 강화) ====================
    function startLevel(trackId) {
      if (isProcessing || gameActive) return;
      safeSetProcessing(true);

      let found = null;
      const phases = [
        { id: 1, tracks: [
          { id: "1-A", name: "1부터 10까지", desc: "가장 기본적인 1의 단위", range: "1~10", step: 1, color: "#10b981" },
          { id: "1-B", name: "1부터 20까지", desc: "1의 단위 조금 더 길게", range: "1~20", step: 1, color: "#10b981" },
          { id: "1-C", name: "1부터 30까지", desc: "빠른 아이를 위한 도전", range: "1~30", step: 1, color: "#10b981" }
        ]},
        { id: 2, tracks: [
          { id: "2-A", name: "10, 20, 30의 경계 느끼기", desc: "10의 배수를 넘을 때마다 특별함 느끼기", range: "8~32", step: 1, color: "#0ea5e9" },
          { id: "2-B", name: "10부터 50까지", desc: "10 단위 내 수의 크기 느끼기", range: "10~50", step: 1, color: "#0ea5e9" },
          { id: "2-C", name: "10부터 100까지", desc: "넓은 범위에서 10 단위 직관", range: "10~100", step: 1, color: "#0ea5e9" },
          { id: "2-D", name: "10씩 더하고 빼기", desc: "10을 단위로 조작하기 (더하기·빼기·왕복) ★", range: "10~80", step: 10, color: "#0ea5e9" }
        ]},
        { id: 3, tracks: [
          { id: "3-2",  name: "2씩 뛰어넘기",  desc: "짝수와 2 단위 이해",     range: "2~40",   step: 2,  color: "#f59e0b" },
          { id: "3-3",  name: "3씩 뛰어넘기",  desc: "3 단위 패턴 발견",       range: "3~45",   step: 3,  color: "#f59e0b" },
          { id: "3-4",  name: "4씩 뛰어넘기",  desc: "4 단위 패턴 발견",       range: "4~52",   step: 4,  color: "#f59e0b" },
          { id: "3-5",  name: "5씩 뛰어넘기",  desc: "5라는 새로운 단위 발견", range: "5~60",   step: 5,  color: "#f59e0b" },
          { id: "3-6",  name: "6씩 뛰어넘기",  desc: "6 단위 패턴 발견",       range: "6~66",   step: 6,  color: "#f59e0b" },
          { id: "3-7",  name: "7씩 뛰어넘기",  desc: "7 단위 패턴 발견",       range: "7~70",   step: 7,  color: "#f59e0b" },
          { id: "3-8",  name: "8씩 뛰어넘기",  desc: "8 단위 패턴 발견",       range: "8~72",   step: 8,  color: "#f59e0b" },
          { id: "3-9",  name: "9씩 뛰어넘기",  desc: "9 단위 패턴 발견",       range: "9~81",   step: 9,  color: "#f59e0b" },
          { id: "3-10", name: "10씩 커지는 수", desc: "10 단위의 강한 인지 ★", range: "10~100", step: 10, color: "#f59e0b" }
        ]},
        { id: 4, tracks: [
          { id: "4-A", name: "100부터 300까지", desc: "100 단위 기본", range: "100~300", step: 10, color: "#f43f5e" },
          { id: "4-B", name: "100부터 500까지", desc: "100 단위 확장", range: "100~500", step: 10, color: "#f43f5e" },
          { id: "4-C", name: "100부터 1000까지", desc: "100→1000 단위 전환", range: "100~1000", step: 50, color: "#f43f5e" },
          { id: "4-D", name: "1000부터 3000까지", desc: "1000 단위 기본", range: "1000~3000", step: 100, color: "#f43f5e" },
          { id: "4-E", name: "1000부터 5000까지", desc: "1000 단위 확장", range: "1000~5000", step: 100, color: "#f43f5e" },
          { id: "4-F", name: "1000부터 10000까지", desc: "1000→10000 단위 + 큰 간격(1000) 조작 ★", range: "1000~10000", step: 500, color: "#f43f5e" }
        ]}
      ];

      phases.forEach(p => p.tracks.forEach(t => { if (t.id === trackId) found = t; }));
      if (!found) { safeSetProcessing(false); return; }

      currentTrackId = trackId;   // "더 할래요"를 위해 현재 트랙 ID 저장
      currentLevel = generateLevel(found);
      sequence = buildSequence(currentLevel);

      // 2-D 전용: 실제 빼기와 상하 이동 시퀀스 생성 (Phase 3 10씩과 차별화)
      if (trackId === "2-D") {
        const shouldReverse = Math.random() < 0.45;           // 45% 확률로 빼기
        const shouldOscillate = !shouldReverse && Math.random() < 0.4; // 40% 확률로 상하 이동

        if (shouldReverse) {
          sequence.reverse();
        } else if (shouldOscillate && sequence.length >= 5) {
          // 간단한 상하 이동 시퀀스 생성 (10을 오가며 조작하는 느낌)
          const osc = [];
          let idx = Math.floor(sequence.length / 2);
          const directions = [1, -1, 1, -1, 1];
          for (let i = 0; i < sequence.length; i++) {
            osc.push(sequence[idx]);
            idx += directions[i % directions.length];
            idx = Math.max(0, Math.min(sequence.length - 1, idx));
          }
          sequence = osc;
        }
      }

      foundCount = 0;
      gameActive = true;

      shuffled = [...sequence];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }

      currentActivity = currentLevel.activity || 'hunt';

      // 화면 전환
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');

      // 헤더 — 실제 생성된 범위를 정확히 보여줘서 라벨과 일치하게 함
      const pill = document.getElementById('level-pill');
      pill.innerHTML = `
        <span style="color:${currentLevel.color}">${currentLevel.name}</span>
        <span style="font-size:10px; opacity:0.75; margin-left:6px;">${currentLevel.range}</span>
      `;
      pill.style.background = `${currentLevel.color}15`;
      pill.style.border = `2px solid ${currentLevel.color}30`;

      updateProgress();

      const qLabel = document.getElementById('question-label');
      qLabel.textContent = currentActivity === 'hunt' 
        ? (currentLang === 'ko' ? '숫자를 순서대로 찾아보세요' : 'Find the numbers in order')
        : (currentLang === 'ko' ? '다음에 올 숫자를 골라보세요' : 'Choose the next number');

      document.getElementById('target-display').textContent = '?';

      renderCurrentActivity();

      // 첫 타겟 자동 음성 (약간 지연)
      setTimeout(() => {
        if (gameActive && sequence.length > 0) {
          speakNumber(sequence[0]);
        }
      }, 650);

      setTimeout(() => safeSetProcessing(false), 600);
    }

    function updateProgress() {
      const el = document.getElementById('progress-pill');
      el.innerHTML = `<span style="color:${currentLevel.color}">${foundCount} / ${currentLevel.count}</span>`;
    }

    // ==================== 활동 렌더러 (안정성 + 시각화 강화) ====================
    function renderCurrentActivity() {
      const container = document.getElementById('play-content');
      container.innerHTML = '';

      if (currentActivity === 'hunt') {
        renderHuntActivity();
      } else {
        renderChoiceActivity();
      }
    }

    function renderHuntActivity() {
      const container = document.getElementById('play-content');
      container.innerHTML = `
        <div class="grid gap-3 mx-auto" style="grid-template-columns: repeat(${currentLevel.cols}, 1fr); max-width: 320px;">
          ${shuffled.map((num, idx) => createVisualCell(num, idx)).join('')}
        </div>
      `;

      container.querySelectorAll('.big-cell').forEach(cell => {
        cell.onclick = () => handleHuntClick(cell);
      });
    }

    function createVisualCell(num, idx) {
      // 모든 숫자 블록은 완전히 동일한 디자인 (사용자 요청)
      const color = currentLevel.color;

      return `
        <div class="big-cell" data-value="${num}" data-idx="${idx}">
          <div class="text-3xl font-black" style="color:${color}">${num}</div>
        </div>
      `;
    }

    function handleHuntClick(cell) {
      if (isProcessing || !gameActive || cell.classList.contains('found')) return;
      safeSetProcessing(true);

      const val = parseInt(cell.dataset.value);
      const expected = sequence[foundCount];

      // === 수정: 버튼을 누른 숫자 자체를 먼저 음성으로 알려줌 ===
      speakNumber(val);   // 항상 먼저, 아이가 누른 숫자를 들려줌 (정답/오답 모두)

      if (val === expected) {
        playCorrect();
        cell.classList.add('found');

        if (currentLevel.step === 10 || currentLevel.step === 5) {
          cell.style.boxShadow = '0 0 0 9px rgba(52, 211, 153, 0.35)';
        }

        foundCount++;
        updateProgress();

        const target = document.getElementById('target-display');
        if (foundCount < sequence.length) {
          target.textContent = sequence[foundCount];
          // 다음 타겟은 자동으로 말하지 않음. 아이가 🔊 버튼을 눌러 직접 들을 수 있게 함
        } else {
          target.textContent = '✓';
        }

        if (foundCount === sequence.length) {
          setTimeout(winLevel, 480);
        }
      } else {
        playWrong();
        cell.classList.add('wrong');
        setTimeout(() => {
          if (cell && !cell.classList.contains('found')) cell.classList.remove('wrong');
        }, 420);
      }
      setTimeout(() => safeSetProcessing(false), 280);
    }

    function renderChoiceActivity() {
      const container = document.getElementById('play-content');
      const expected = sequence[foundCount];

      const choices = [expected];
      while (choices.length < 4) {
        let wrong = expected + currentLevel.step * (1 + Math.random() * 3 | 0) * (Math.random() > 0.5 ? 1 : -1);
        if (wrong < 0 || choices.includes(wrong)) wrong = expected + currentLevel.step * 2;
        if (!choices.includes(wrong)) choices.push(wrong);
      }
      for (let i = choices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [choices[i], choices[j]] = [choices[j], choices[i]];
      }

      // Choice 모드에서는 불필요한 장식적 프리뷰 제거 (사용자 요청: 게임 내부에 그림/이모지 형태 불필요)
      container.innerHTML = `
        <div class="text-center w-full max-w-[300px]">
          <div class="grid grid-cols-2 gap-3">
            ${choices.map(c => `
              <button class="choice-btn flex items-center justify-center font-extrabold"
                      style="color:${currentLevel.color}; border-color:${currentLevel.color}33"
                      data-val="${c}">
                ${c}
              </button>
            `).join('')}
          </div>
        </div>
      `;

      container.querySelectorAll('button[data-val]').forEach(btn => {
        btn.onclick = () => {
          if (isProcessing || !gameActive) return;
          safeSetProcessing(true);

          const val = parseInt(btn.dataset.val);
          // === 수정: 버튼을 누른 숫자 자체를 먼저 음성으로 알려줌 ===
          speakNumber(val);   // 항상 먼저, 아이가 선택한 숫자를 들려줌

          if (val === expected) {
            playCorrect();
            btn.style.background = '#dcfce7';
            btn.style.borderColor = '#4ade80';
            btn.style.color = '#166534';

            foundCount++;
            updateProgress();

            const target = document.getElementById('target-display');
            if (foundCount < sequence.length) {
              target.textContent = sequence[foundCount];
              // 다음 타겟 자동 음성 제거 → 아이가 🔊 버튼으로 직접 들을 수 있게 함
              // (render는 유지)
              renderChoiceActivity();
            } else {
              target.textContent = '✓';
              setTimeout(winLevel, 420);
            }
          } else {
            playWrong();
            btn.style.background = '#fef3c7';
            btn.style.borderColor = '#fbbf24';
            setTimeout(() => {
              if (btn) {
                btn.style.background = 'white';
                btn.style.borderColor = currentLevel.color + '33';
              }
            }, 420);
          }
          setTimeout(() => safeSetProcessing(false), 300);
        };
      });
    }

    // ==================== 힌트 (음성 포함) ====================
    function giveHint() {
      if (!currentLevel || !gameActive || isProcessing) return;

      const expected = sequence[foundCount];
      const area = document.getElementById('play-content');

      speakText(currentLang === 'ko' ? `${expected}를 찾아보세요` : `Look for ${expected}`, currentLang);

      if (currentActivity === 'hunt') {
        const correctCell = area.querySelector(`.big-cell[data-value="${expected}"]`);
        if (correctCell) {
          const orig = correctCell.style.boxShadow;
          correctCell.style.boxShadow = '0 0 0 10px rgba(52, 211, 153, 0.4)';
          setTimeout(() => {
            if (correctCell && !correctCell.classList.contains('found')) correctCell.style.boxShadow = orig || '';
          }, 1450);
        }
      } else {
        const correctBtn = area.querySelector(`button[data-val="${expected}"]`);
        if (correctBtn) {
          correctBtn.style.transform = 'scale(1.08)';
          correctBtn.style.borderColor = '#34d399';
          setTimeout(() => {
            if (correctBtn) {
              correctBtn.style.transform = 'scale(1)';
              correctBtn.style.borderColor = currentLevel.color + '33';
            }
          }, 1100);
        }
      }
    }

    // ==================== 승리 & 컨페티 ====================
    function winLevel() {
      if (!gameActive) return;
      gameActive = false;

      playWin();
      // 꽃가루(컨페티) 효과 완전 삭제 (사용자 요청)

      const modal = document.getElementById('celebration-modal');
      // 승리 화면 이모지도 간소화 (사용자 요청에 따라 장식 최소화)
      // document.getElementById('celebration-emoji').textContent = ...

      const msg = currentLang === 'ko'
        ? (currentLevel.step === 1 ? '1씩 커지는 규칙을 발견했어요!' : `${currentLevel.step}씩 뛰는 규칙을 발견했어요!`)
        : 'You found the pattern! Amazing!';

      document.getElementById('celebration-text').textContent = msg;

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      // 승리 음성
      setTimeout(() => {
        const winMsg = currentLang === 'ko' ? '정말 잘했어요!' : 'You did amazing!';
        speakText(winMsg, currentLang);
      }, 900);

      // 진행도 저장 (완료 시 3성 부여)
      if (currentTrackId) {
        saveProgress(currentTrackId, 3);
      }
    }

    function hideCelebration() {
      const modal = document.getElementById('celebration-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function continuePlaying() {
      hideCelebration();

      // "더 할래요" → 같은 단계에서 새로운 문제 세트로 계속 진행 (메인으로 나가지 않음)
      if (currentTrackId) {
        // 약간의 딜레이를 주고 같은 트랙으로 새 문제 생성
        setTimeout(() => {
          if (!gameActive) {   // 게임이 이미 종료된 상태가 아니라면
            startLevel(currentTrackId);
          }
        }, 120);
      } else {
        exitToMenu();
      }
    }

    // ==================== 사운드 (Web Audio) ====================
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
      return audioCtx;
    }
    function playCorrect() {
      const ctx = getAudio(); if (!ctx) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = 880;
      const g = ctx.createGain(); g.gain.value = 0.3;
      o.frequency.linearRampToValueAtTime(1320, t + 0.12);
      g.gain.linearRampToValueAtTime(0.001, t + 0.22);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.26);
    }
    function playWrong() {
      const ctx = getAudio(); if (!ctx) return;
      const t = ctx.currentTime;
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = 210;
      const g = ctx.createGain(); g.gain.value = 0.22;
      g.gain.linearRampToValueAtTime(0.001, t + 0.32);
      o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 0.36);
    }
    function playWin() {
      const ctx = getAudio(); if (!ctx) return;
      const notes = [523, 659, 784, 1046, 1319];
      notes.forEach((f, i) => setTimeout(() => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
        const g = ctx.createGain(); g.gain.value = 0.32;
        g.gain.linearRampToValueAtTime(0.001, ctx.currentTime + 0.48);
        o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 0.52);
      }, i * 78));
    }

    // 컨페티(꽃가루) 효과 완전 삭제됨 (사용자 요청)

    // ==================== EXIT & RESET (안정성) ====================
    function exitToMenu() {
      hideCelebration();
      const synth = window.speechSynthesis;
      if (synth) synth.cancel();

      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('start-screen').classList.remove('hidden');

      currentLevel = null;
      sequence = [];
      shuffled = [];
      foundCount = 0;
      gameActive = false;
      isProcessing = false;
      document.getElementById('play-content').innerHTML = '';

      renderLevelSelection();
    }

    // ==================== INIT ====================
    async function init() {
      // 언어 설정 로드
      loadLanguagePreference();

      // 음성 로딩
      await loadVoices();

      // 레벨 선택 렌더
      renderLevelSelection();

      // PWA standalone 대응
      if (window.matchMedia('(display-mode: standalone)').matches) {
        document.body.style.paddingTop = 'env(safe-area-inset-top, 0)';
      }

      // 키보드 안전장치
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && !document.getElementById('game-screen').classList.contains('hidden')) {
          exitToMenu();
        }
      });

      // 전역 클릭으로 TTS 활성화 (iOS 등)
      document.addEventListener('touchstart', () => {
        if (window.speechSynthesis) window.speechSynthesis.resume();
      }, { once: true });

      console.log('%c[숫자순서대로 v5.0] 음성 지원 + 안정성 강화 완료', 'color:#854d0e');
    }

    window.onload = init;
  </script>
</body>
